<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kalkulator</title>
<style>
:root{
  --bg:#e8ebe4; --body:#FFC0CB; --screen:#c9d6b8; --ink:#1f2a22; --muted:#5d6b5f;
  --key:#f6f7f3; --keytxt:#1f2a22; --op:#3d5a4a; --optxt:#f6f7f3; --clear:#c4553d; --eq:#d9a441; --eqtxt:#1f2a22;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141a17; --body:#222c27; --screen:#a9bb94; --ink:#16200f; --muted:#3f4d35;
    --key:#33403a; --keytxt:#eef1ea; --op:#4d7561; --optxt:#FFC0CB; --clear:#c4553d; --eq:#d9a441; --eqtxt:#1f2a22;
  }
}
:root[data-theme="dark"]{
  --bg:#141a17; --body:#222c27; --screen:#a9bb94; --ink:#16200f; --muted:#3f4d35;
  --key:#33403a; --keytxt:#eef1ea; --op:#4d7561; --optxt:#f6f7f3; --clear:#c4553d; --eq:#d9a441; --eqtxt:#1f2a22;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);display:flex;align-items:center;justify-content:center;font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;padding:16px}
.calc{width:100%;max-width:340px;background:var(--body);border-radius:22px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.screen{background:var(--screen);border-radius:12px;padding:12px 14px;margin-bottom:16px;text-align:right;min-height:96px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;box-shadow:inset 0 2px 6px rgba(0,0,0,.2)}
.expr{color:var(--muted);font-size:15px;min-height:20px;word-break:break-all}
.out{color:var(--ink);font-size:38px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
button{font:inherit;font-size:21px;font-weight:500;border:0;border-radius:12px;height:58px;cursor:pointer;background:var(--key);color:var(--keytxt);box-shadow:0 3px 0 rgba(0,0,0,.25);transition:transform .06s,box-shadow .06s}
button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
button:focus-visible{outline:3px solid var(--eq);outline-offset:2px}
.op{background:var(--op);color:var(--optxt)}
.clr{background:var(--clear);color:#FFC0CB}
.eq{background:var(--eq);color:var(--eqtxt)}
.zero{grid-column:span 2}
</style>
</head>
<body>
<main class="calc" aria-label="Kalkulator">
  <div class="screen" aria-live="polite">
    <div class="expr" id="expr"></div>
    <div class="out" id="out">0</div>
  </div>
  <div class="keys">
    <button class="clr" data-a="clear">AC</button>
    <button class="op" data-a="back" aria-label="Hapus">⌫</button>
    <button class="op" data-a="percent">%</button>
    <button class="op" data-a="÷">÷</button>
    <button data-n="7">7</button><button data-n="8">8</button><button data-n="9">9</button>
    <button class="op" data-a="×">×</button>
    <button data-n="4">4</button><button data-n="5">5</button><button data-n="6">6</button>
    <button class="op" data-a="−">−</button>
    <button data-n="1">1</button><button data-n="2">2</button><button data-n="3">3</button>
    <button class="op" data-a="+">+</button>
    <button class="zero" data-n="0">0</button>
    <button data-a="dot">,</button>
    <button class="eq" data-a="eq">=</button>
  </div>
</main>
<script>
(function(){
  var cur="0", prev=null, op=null, fresh=false;
  var out=document.getElementById("out"), expr=document.getElementById("expr");

  function fmt(s){
    if(s==="Error") return "Tidak valid";
    var neg=s[0]==="-", p=(neg?s.slice(1):s).split(".");
    p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,".");
    return (neg?"-":"")+p.join(",");
  }
  function show(){
    out.textContent=fmt(cur);
    expr.textContent=(prev!==null&&op)?fmt(String(prev))+" "+op:"";
    var n=cur.length; out.style.fontSize=n>12?"22px":n>9?"28px":"38px";
  }
  function calc(a,b,o){
    a=parseFloat(a); b=parseFloat(b);
    var r = o==="+"?a+b : o==="−"?a-b : o==="×"?a*b : (b===0?NaN:a/b);
    if(!isFinite(r)) return "Error";
    return String(parseFloat(r.toPrecision(12)));
  }
  function num(d){
    if(cur==="Error"||fresh){cur="0";fresh=false;}
    if(cur.replace(/[-.]/g,"").length>=15) return;
    cur = cur==="0" ? d : cur+d;
  }
  function act(a){
    if(a==="clear"){cur="0";prev=null;op=null;fresh=false;return;}
    if(cur==="Error"){cur="0";return;}
    if(a==="back"){ if(fresh) return; cur=cur.length>1&&!(cur.length===2&&cur[0]==="-")?cur.slice(0,-1):"0"; return; }
    if(a==="dot"){ if(fresh){cur="0";fresh=false;} if(cur.indexOf(".")<0) cur+="."; return; }
    if(a==="percent"){ cur=String(parseFloat((parseFloat(cur)/100).toPrecision(12))); fresh=true; return; }
    if(a==="eq"){
      if(op===null||prev===null) return;
      cur=calc(prev,cur,op); prev=null; op=null; fresh=true; return;
    }
    // operator
    if(op!==null&&!fresh){ cur=calc(prev,cur,op); if(cur==="Error"){prev=null;op=null;return;} }
    prev=cur; op=a; fresh=true;
  }
  document.querySelector(".keys").addEventListener("click",function(e){
    var b=e.target.closest("button"); if(!b) return;
    if(b.dataset.n!==undefined) num(b.dataset.n); else act(b.dataset.a);
    show();
  });
  document.addEventListener("keydown",function(e){
    var k=e.key, m={"*":"×","/":"÷","-":"−","+":"+"};
    if(/^\d$/.test(k)) num(k);
    else if(m[k]){ e.preventDefault(); act(m[k]); }
    else if(k==="."||k===",") act("dot");
    else if(k==="Enter"||k==="="){ e.preventDefault(); act("eq"); }
    else if(k==="Backspace") act("back");
    else if(k==="Escape") act("clear");
    else if(k==="%") act("percent");
    else return;
    show();
  });
  show();
})();
</script>
</body>
</html>
